name: CI

# Every branch and every pull request. Until 2026-09-15 push was limited to main,
# so a pushed branch ran nothing and the backend, frontend, e2e and lint jobs had
# never run on GitHub. No branch or path filter: a filter is how a branch goes
# unchecked. Guarded by kinyamed/frontend/src/__tests__/ci-triggers.test.ts.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    # The claim this repository rests on: every committed digest can be
    # re-derived from seed 42. The dataset pipeline is pure standard library,
    # so this job installs nothing and cannot break because of an upstream
    # release — which is exactly what makes the badge worth reading.
    name: Reproducibility and dataset tests
    runs-on: ubuntu-latest
    # 45, raised from 20 at the v2 freeze on 2026-09-05. The attribution sweep
    # runs TWICE here on purpose — as its own step, and again inside the suite.
    # Attribution has failed silently FOUR times and a green suite hid every one,
    # so the standalone step exists to survive someone deselecting the file.
    # The sweep went from ~2.5 min to ~12.5 min when the v2 frame space grew
    # 8.8x (1,500 -> 13,200 combinations), so the pair is ~25 min and 20 no
    # longer fits. Keep both runs and raise the limit — do not deselect. If 45
    # stops being enough, sample the frame space; do not remove a guard.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show that no dependencies are installed
        run: python -c "import sys; print(sys.version); import importlib.util; print('torch present:', importlib.util.find_spec('torch') is not None)"

      - name: Re-derive the sample and both splits from seed 42
        run: make verify

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Attribution sweep over the real authored corpus
        # Every authored phrase, every valid relation, every frame combination,
        # attributed back to its canonical form. Run as its own step as well as
        # inside the suite: attribution has failed silently three times and a
        # green suite hid all three, so this guard does not depend on the file
        # staying selected by default.
        run: make check-attribution

      - name: Dataset test suite (training tests skip without torch)
        run: cd kinyamed/ml_model && python -m pytest -q -rs

  reproducibility-full:
    # The strong claim: the 1,000,000-row corpus is regenerated from seed 42
    # and every digest in both frozen manifests is re-derived and compared.
    # Split from the sample job so the fast signal stays fast — this one takes
    # a couple of minutes and about a gigabyte of scratch.
    name: Full 1M-row digest re-derivation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate 1,000,000 rows and check every frozen digest
        # Installs nothing: the pipeline is pure standard library.
        run: make verify-full

  training-tests:
    # Checkpoint and resume tests, which need torch. Split into its own job so
    # a slow dependency install never delays the reproducibility signal above.
    name: Training checkpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kinyamed/ml_model/requirements-dev.txt

      - name: Install pinned dependencies
        # torch is pinned to the +cpu local version, which exists only on the
        # PyTorch CPU index, not on PyPI. Without this URL the job fails at
        # install with "no matching distribution for torch==2.12.0+cpu".
        # The pins stay exact on purpose: testing a torch other than the one
        # that produced the results would defeat the point of pinning at all.
        run: |
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r kinyamed/ml_model/requirements-dev.txt

      - name: Full test suite
        run: cd kinyamed/ml_model && python -m pytest -q -rs

  hygiene:
    # Guards the ignore rules. A 471 MB model file or a 181 MB corpus reaching
    # a commit is the kind of mistake that is painful to undo after a push.
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: No tracked file may exceed 5 MB
        run: |
          oversized=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 5120 {print $1" KB\t"$2}')
          if [ -n "$oversized" ]; then
            echo "::error::Tracked files over 5 MB:"; echo "$oversized"; exit 1
          fi
          echo "No tracked file exceeds 5 MB."

      - name: No generated data, model weights or crash debris tracked
        run: |
          bad=$(git ls-files | grep -E '(\.safetensors|\.partial|\.orig|symptoms_large\.csv|_holdout\.csv|/venv/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::These should be ignored, not tracked:"; echo "$bad"; exit 1
          fi
          echo "No generated artefacts are tracked."

  backend:
    # AUDIT 1.1. Until 2026-09-09 this workflow ran only the ML package, so the
    # backend suite ran when someone remembered. That is how a red HEAD reached
    # this remote: every local gate was run except the one that was skipped.
    name: Backend suite
    runs-on: ubuntu-latest
    # The suite runs against a real PostgreSQL: tests/conftest.py creates and
    # migrates `kinyamed_test` through the `postgres` maintenance database, and
    # refuses to load without DATABASE_URL. A developer machine has a local server
    # and a git-ignored backend/.env; a runner has neither, so run #77 exited 4 at
    # conftest import. Guarded by frontend/src/__tests__/ci-backend-db.test.ts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # The logout blocklist (FR-05-10) withdraws an access token before it
      # expires. Without a Redis here its tests would skip, and a skipped test
      # is a test nobody is running -- which is the state this job exists to
      # end. The DEGRADED path is exercised separately by pointing the client
      # at a closed port, so both halves are covered on the runner.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # A throwaway database on the runner. None of these is a secret: they exist
      # only for the lifetime of the job, and SMS is off.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SMS_API_KEY: ci-only-placeholder
      SMS_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    defaults:
      run:
        working-directory: kinyamed/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kinyamed/backend/requirements*.txt

      # Kafka is started as a STEP rather than a service container on purpose.
      # A service container that fails to come up reports only "Initialize
      # containers: failure" and its logs need admin rights to download, which
      # is how the first attempt at this was undebuggable. A step prints the
      # broker's own logs into the job output when the wait fails.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name kafka -p 9092:9092 \
            -e KAFKA_CFG_NODE_ID=0 \
            -e KAFKA_CFG_PROCESS_ROLES=controller,broker \
            -e KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093 \
            -e KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true \
            -e KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e ALLOW_PLAINTEXT_LISTENER=yes \
            bitnami/kafka:3.7

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/localhost/9092) 2>/dev/null; then
              echo "broker accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kafka did not accept connections within 60s. Broker log:"
          docker logs kafka 2>&1 | tail -80
          exit 1

      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Test suite
        # -rs so a skip is visible. A silently skipped test is a test nobody
        # is running, which is the state this job exists to end.
        run: python -m pytest -q -rs

  frontend:
    # AUDIT 1.1. The frontend had no test runner at all until 2026-09-09 and
    # still had no automation after it gained one.
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinyamed/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: kinyamed/frontend/package-lock.json

      - name: Install from the lockfile
        # `ci`, not `install`: it fails on a lockfile that disagrees with
        # package.json rather than silently resolving a different tree.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        # A build failure is a real failure: tsc passing while vite cannot
        # bundle has happened here already.
        run: npm run build

  e2e:
    # The browser tests guard two safety interlocks: on a 503 the nurse sees the
    # full manual-triage instruction, and every screen shows the "automated
    # triage offline" banner while readiness reports model: false. Until
    # 2026-09-15 they ran only when someone remembered, and an untested
    # interlock decays. `src/__tests__/ci-e2e.test.ts` fails if this job is
    # removed or allowed to fail.
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kinyamed/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: kinyamed/frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Install Chrome for Playwright
        # The config uses channel "chrome". --force because the runner image
        # already ships a Chrome that Playwright will not install over otherwise.
        run: npx playwright install --with-deps --force chrome

      - name: Browser tests
        # No API is started: specs serve recorded responses pinned to the real
        # API by backend contract tests. Playwright starts Vite itself.
        run: npm run e2e

      - name: Keep traces of failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: kinyamed/frontend/test-results/
          retention-days: 14

  lint:
    # AUDIT 1.2. 15,585 lines of Python with no linter configured. Kept as a
    # separate job so a style failure is distinguishable at a glance from a
    # test failure.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Must match `required-version` in pyproject.toml, which is what
        # stops a differently-versioned ruff from formatting differently.
        run: python -m pip install --disable-pip-version-check ruff==0.16.6
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
