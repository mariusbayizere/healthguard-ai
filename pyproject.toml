# AUDIT 1.2 — the linter this repository did not have.
#
# One configuration at the repository root, covering both Python packages. Two
# packages with two configs is the same duplication problem this audit found in
# the urgency ordering, one level up.

[tool.ruff]
# Pinned, and pinned HERE rather than only in CI. The workflow installed
# ruff==0.6.4 while this tree had been formatted by 0.16.6, and the two
# disagree about formatting on 18 files -- so `ruff format --check` passed on
# the machine that ran it and would have failed in CI, which is the same
# "green locally, red in CI" shape AUDIT 1.1 is about. `required-version`
# makes a mismatched ruff refuse to run instead of quietly reformatting
# differently. Bump this and the pin in .github/workflows/ci.yml together.
required-version = "0.16.6"
line-length = 88
target-version = "py311"
extend-exclude = [
    "kinyamed/backend/venv",
    "kinyamed/backend/migrations/versions",  # generated by Alembic
    "kinyamed/frontend",
    # FROZEN. dataset/vocabulary_v1.py is the v1 corpus, byte-identical by
    # requirement: `make verify-full` re-derives digests from it. A formatter
    # touching it would break reproducibility, which outranks style.
    "kinyamed/ml_model/dataset/vocabulary_v1.py",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — the unused-name and undefined-name class
    "I",        # import ordering
    "B",        # bugbear — mutable defaults, unused loop vars, broad excepts
    "UP",       # pyupgrade
    "SIM",      # simplifiable constructs
    "RUF",      # ruff's own
    # AUDIT 2.3. The codebase already carries `# noqa: BLE001` comments with
    # reasons attached, written for a linter that was never configured.
    # Selecting the rule makes those annotations load-bearing and forces the
    # two undocumented broad excepts to be narrowed or explained.
    "BLE",      # blind except
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends() in a default is the framework's idiom
    "SIM108", # a ternary is not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# The corpus and its documentation contain Kinyarwanda, Swahili and French, so
# non-ASCII characters in strings are the content, not a homoglyph attack.
"kinyamed/ml_model/review/*.py" = ["RUF001", "RUF002", "RUF003", "E402"]
"kinyamed/ml_model/dataset/*.py" = ["RUF001", "RUF002", "RUF003"]
"kinyamed/ml_model/training/*.py" = ["RUF001", "RUF002", "RUF003"]
"kinyamed/backend/app/services/*.py" = ["RUF001", "RUF002", "RUF003"]
# Tests assert on values; a magic number in an assertion is the point.
"**/tests/**" = ["B011"]
# The review scripts carry large declared data maps whose shape is the
# documentation. Import-order churn there costs more than it returns.

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
